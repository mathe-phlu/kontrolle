<script>const D = {"aufnahme": "nie", "kapitel": 7, "leiste": "oben", "mitnehmen": true, "farbe": "beweis", "start": {"bild": "erkundung.png", "titel": "Vier Grössen, eine fehlt", "lage": "Anna, Ben und Clara sind an der Chilbi. An jeder Bude geht es um Treffer: Wie viele Fragen errät man, wie oft trifft man, wie oft muss man drehen? Jede solche Frage hat vier Grössen: die Länge n der Kette, die Trefferwahrscheinlichkeit p, die Trefferzahl k — etwa X = 2, X ≤ 2 oder X ≥ 4 — und die Wahrscheinlichkeit P dafür. Kennt man drei, fehlt die vierte.", "frage": "Welche fehlt jeweils — und wie kommt man an sie heran?", "nachsatz": "Erst die Fragen von der Chilbi lesen, eintragen und gruppieren, dann die Aufgaben aus dem Skript dazulegen. Danach testen Sie aus, was sich nur durch Austesten finden lässt, und suchen eine Abkürzung dafür."}, "etappen": [{"nr": "1", "name": "Was ist gesucht, und wie wird gerechnet?", "rang": "Pflicht", "rolle": "zugang", "auftrag": "Sortieren Sie die Fragen von der Chilbi danach, was fehlt, dann die Aufgaben aus dem Skript."}, {"nr": "2", "name": "Gibt es eine Abkürzung fürs Austesten?", "rang": "Pflicht", "rolle": "aktion", "auftrag": "Erst austesten, dann eine Abkürzung fürs Austesten suchen."}], "bn": {"karten": [{"id": "K19", "quelle": "Quizbude", "kurz": "Quizbude", "text": "An der Quizbude beantwortet Anna 10 Fragen mit je vier Antworten, davon ist genau eine richtig. Sie kennt keine Antwort und rät jedes Mal. Wie wahrscheinlich hat sie genau 3 Fragen richtig?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 10, "p": {"t": "0.25", "w": 0.25}, "iv": [3, 3], "spiegel": [7, 7]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(10; 0.25), X = 3: P ≈ 25.0 %", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "<mark class=\"m-P\">P(X = 3)</mark> = <span class=\"bn-binom\"><span><span>10</span><span>3</span></span></span> · 0.25<sup>3</sup> · 0.75<sup>7</sup>"}, {"id": "K21", "quelle": "Glücksrad", "kurz": "Glücksrad", "text": "Das Glücksrad an der Chilbi bleibt mit Wahrscheinlichkeit 1/8 auf dem Gewinnfeld stehen. Wie oft muss Ben drehen, damit er mit mindestens 90 % mindestens einmal gewinnt?", "gesucht": "n", "ort": "m1", "soll": {"ketten": [{"n": "?", "p": {"t": "1/8", "w": 0.125}, "iv": [1, "n"], "spiegel": null}], "frage": "n", "P": {"t": "≥ 90 %", "w": 0.9}, "frei": false}, "fehler": [{"iv": [[1, 1]], "art": "falsch", "text": "«Mindestens einmal» heisst: einmal oder öfter."}], "pruefen": false, "notiz": "", "loesung": "1 − (7/8)ⁿ ≥ 0.9 ⇒ n = 18 (P ≈ 91.0 %; bei 17: 89.7 %)", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "P(X ≥ 1) = 1 − (7/8)<sup><mark class=\"m-n\">n</mark></sup> ≥ 0.9"}, {"id": "K26", "quelle": "Würfelbude", "kurz": "Würfelbude", "text": "An der Würfelbude würfelt Ben 600-mal. Im Schnitt wären das 100 Sechsen. In welchem Bereich um 100 liegt die Anzahl Sechsen mit mindestens 95 %? Gesucht ist der kleinste Bereich, der nach unten und nach oben gleich weit reicht.", "gesucht": "k", "ort": "sonst", "soll": {"ketten": [{"n": 600, "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": ["a", "b"], "spiegel": null}], "frage": "k", "P": {"t": "≥ 95 %", "w": 0.95}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "kleinster Bereich um μ = 100 mit P ≥ 95 %: [82; 118] (95.8 %; [83; 117]: 94.5 %)", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "P(<mark class=\"m-k\">a</mark> ≤ X ≤ <mark class=\"m-k\">b</mark>) = <span class=\"bn-sig\">Σ<span><sup><mark class=\"m-k\">b</mark></sup><sub>i = <mark class=\"m-k\">a</mark></sub></span></span> <span class=\"bn-binom\"><span><span>600</span><span>i</span></span></span> · (1/6)<sup>i</sup> · (5/6)<sup>600 − i</sup> ≥ 0.95"}, {"id": "K27", "quelle": "Penaltyschiessen", "kurz": "Penaltyschiessen", "text": "Beim Penaltyschiessen tritt Clara 5-mal an. Wie gut muss sie ie viele Ersatzballone muss die Betreiberin bereitlegen, damit sie mit mindestens 95 % reichen?", "gesucht": "k", "ort": "sonst", "soll": {"ketten": [{"n": 500, "p": {"t": "0.02", "w": 0.02}, "iv": [0, "k"], "spiegel": null}], "frage": "k", "P": {"t": "≥ 95 %", "w": 0.95}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "kleinstes k mit P(X ≤ k) ≥ 95 %: k = 15 (95.3 %; bei 14: 91.9 %)", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "P(X ≤ <mark class=\"m-k\">k</mark>) = <span class=\"bn-sig\">Σ<span><sup><mark class=\"m-k\">k</mark></sup><sub>i = 0</sub></span></span> <span class=\"bn-binom\"><span><span>500</span><span>i</span></span></span> · 0.02<sup>i</sup> · 0.98<sup>500 − i</sup> ≥ 0.95"}, {"id": "K25", "quelle": "Greifautomat", "kurz": "Greifautomat", "text": "Am Greifautomaten erwischt Ben bei jedem Versuch mit Wahrscheinlichkeit 1/4 ein Plüschtier. Er will mindestens 3 Plüschtiere. Wie viele Versuche muss er einplanen, damit es mit mindestens 90 % klappt?", "gesucht": "n", "ort": "sonst", "soll": {"ketten": [{"n": "?", "p": {"t": "0.25", "w": 0.25}, "iv": [3, "n"], "spiegel": null}], "frage": "n", "P": {"t": "≥ 90 %", "w": 0.9}, "frei": false}, "fehler": [{"iv": [[4, "n"]], "art": "falsch", "text": "«Mindestens 3» schliesst die 3 ein."}], "pruefen": false, "notiz": "", "loesung": "kleinstes n mit P(X ≥ 3) ≥ 90 %: n = 20 (90.9 %; bei 19: 88.9 %)", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "P(X ≥ 3) = 1 − [0.75<sup><mark class=\"m-n\">n</mark></sup> + <mark class=\"m-n\">n</mark> · 0.25 · 0.75<sup><mark class=\"m-n\">n</mark> − 1</sup> + <span class=\"bn-binom\"><span><span><mark class=\"m-n\">n</mark></span><span>2</span></span></span> · 0.25<sup>2</sup> · 0.75<sup><mark class=\"m-n\">n</mark> − 2</sup>] ≥ 0.9"}, {"id": "K22", "quelle": "Korbwurf-Bude", "kurz": "Korbwurf-Bude", "text": "An der Korbwurf-Bude wirft Anna 5 Bälle. Wie gross muss ihre Trefferquote mindestens sein, damit mit 99 % mindestens einer der Würfe trifft?", "gesucht": "p", "ort": "m1", "soll": {"ketten": [{"n": 5, "p": "?", "iv": [1, 5], "spiegel": [0, 4]}], "frage": "p", "P": {"t": "≥ 99 %", "w": 0.99}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "1 − (1 − p)⁵ ≥ 0.99 ⇒ p ≥ 0.602", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": "P(X ≥ 1) = 1 − (1 − <mark class=\"m-p\">p</mark>)<sup>5</sup> ≥ 0.99"}, {"id": "K24", "quelle": "Losbude", "kurz": "Losbude", "text": "In der Trommel der Losbude liegen noch 10 Lose, davon 4 Gewinnlose. Ben zieht 3 Lose, eines nach dem anderen, ohne Zurücklegen. Wie wahrscheinlich sind genau 2 Gewinnlose dabei?", "gesucht": "P", "ort": "keine", "soll": {"ketten": [{"n": 3, "p": null, "iv": "–", "spiegel": null}], "frage": "P", "P": "?", "frei": true}, "fehler": [], "pruefen": false, "notiz": "Keine Bernoulli-Kette: Ohne Zurücklegen ändert sich die Wahrscheinlichkeit für ein Gewinnlos von Zug zu Zug.", "loesung": "ohne Zurücklegen abgezählt: (4 über 2) · (6 über 1) : (10 über 3) = 36/120 = 30 %", "knacknuss": null, "faelle": null, "zug": 1, "pflicht": true, "bild": null, "formel": null}, {"id": "K01", "quelle": "Kap. 7 · Beispiel", "kurz": "8 Würfe", "text": "Wir würfeln achtmal. Wie wahrscheinlich ist es, dass genau zwei Sechsen auftreten?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 8, "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": [2, 2], "spiegel": [6, 6]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(8; 1/6), X = 2: P ≈ 26.0 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": "<mark class=\"m-P\">P(X = 2)</mark> = <span class=\"bn-binom\"><span><span>8</span><span>2</span></span></span> · (1/6)<sup>2</sup> · (5/6)<sup>6</sup>"}, {"id": "K02", "quelle": "Kap. 7 · Beispiel", "kurz": "6 Kinder", "text": "Eine Familie hat sechs Kinder; Jungen und Mädchen sind gleich wahrscheinlich. Wie wahrscheinlich sind es höchstens zwei Jungen?", "gesucht": "P", "ort": "Pb", "soll": {"ketten": [{"n": 6, "p": {"t": "0.5", "w": 0.5}, "iv": [0, 2], "spiegel": [4, 6]}], "frage": "P", "P": "?", "frei": false}, "fehler": [{"iv": [[0, 1]], "art": "falsch", "text": "«Höchstens zwei» schliesst die 2 ein."}], "pruefen": false, "notiz": "", "loesung": "P(X ≤ 2) = P(X=0) + P(X=1) + P(X=2) ≈ 34.4 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": "<mark class=\"m-P\">P(X ≤ 2)</mark> = 0.5<sup>6</sup> + 6 · 0.5 · 0.5<sup>5</sup> + <span class=\"bn-binom\"><span><span>6</span><span>2</span></span></span> · 0.5<sup>2</sup> · 0.5<sup>4</sup>"}, {"id": "K03", "quelle": "Aufgabe 7.1 A", "kurz": "Aufgabe 7.1 A", "text": "Ein Würfel wird viermal geworfen. Wie wahrscheinlich ist: in den ersten beiden Würfen je eine Sechs, sonst nicht?", "gesucht": "P", "ort": "keine", "soll": {"ketten": [{"n": 4, "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": "–", "spiegel": null}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "Eine Bernoulli-Kette, aber kein Intervall der Trefferzahl: ein einziger Pfad, ohne Binomialkoeffizient.", "loesung": "ein Pfad: (1/6)² · (5/6)² ≈ 1.93 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": null}, {"id": "K06", "quelle": "Aufgabe 7.2", "kurz": "Aufgabe 7.2 Tennis", "text": "A gewinnt einen Satz gegen B mit 65 %. Gespielt wird auf drei gewonnene Sätze. Mit welcher Wahrscheinlichkeit gewinnt A den Match?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 2, "p": {"t": "0.65", "w": 0.65}, "iv": [2, 2], "spiegel": [0, 0]}, {"n": 3, "p": {"t": "0.65", "w": 0.65}, "iv": [2, 2], "spiegel": [1, 1]}, {"n": 4, "p": {"t": "0.65", "w": 0.65}, "iv": [2, 2], "spiegel": [2, 2]}], "frage": "P", "P": "?", "frei": false}, "fehler": [{"iv": [[3, 3], [3, 3], [3, 3]], "art": "falsch", "text": "Gezählt wird nur der Teil vor dem letzten Satz: Dort gewinnt A genau 2 Sätze, den dritten im letzten Satz."}], "pruefen": false, "notiz": "Gruppe «P gesucht, X = k», drei Fälle.", "loesung": "3:0 + 3:1 + 3:2 = 0.2746 + 0.2884 + 0.2018 ≈ 76.5 %", "knacknuss": {"alt_ort": "keine"}, "faelle": {"zeilen": ["Match dauert 3 Sätze", "Match dauert 4 Sätze", "Match dauert 5 Sätze"], "zusatz": "und der letzte Satz geht an A"}, "zug": 2, "pflicht": true, "bild": null, "formel": null}, {"id": "K07", "quelle": "Aufgabe 7.3", "kurz": "Aufgabe 7.3", "text": "Wie oft muss man würfeln, damit die Chance auf wenigstens eine Sechs mehr als 90 % beträgt?", "gesucht": "n", "ort": "m1", "soll": {"ketten": [{"n": "?", "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": [1, "n"], "spiegel": null}], "frage": "n", "P": {"t": "> 90 %", "w": 0.9}, "frei": false}, "fehler": [{"iv": [[1, 1]], "art": "falsch", "text": "«Wenigstens eine» heisst: eine oder mehr."}], "pruefen": false, "notiz": "", "loesung": "1 − (5/6)ⁿ > 0.9 ⇒ n = 13 (P ≈ 90.7 %)", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": "P(X ≥ 1) = 1 − (5/6)<sup><mark class=\"m-n\">n</mark></sup> > 0.9"}, {"id": "K08", "quelle": "Aufgabe 7.4", "kurz": "Aufgabe 7.4 Torwand", "text": "Torwand: Wie gross muss die Trefferwahrscheinlichkeit p sein, damit bei 6 Schüssen mit mindestens 95 % wenigstens ein Tor fällt?", "gesucht": "p", "ort": "m1", "soll": {"ketten": [{"n": 6, "p": "?", "iv": [1, 6], "spiegel": [0, 5]}], "frage": "p", "P": {"t": "≥ 95 %", "w": 0.95}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "1 − (1 − p)⁶ ≥ 0.95 ⇒ p ≥ 0.393", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": "P(X ≥ 1) = 1 − (1 − <mark class=\"m-p\">p</mark>)<sup>6</sup> ≥ 0.95"}, {"id": "K11", "quelle": "Aufgabe 7.5 c", "kurz": "Aufgabe 7.5 c", "text": "Ein Kundendienst betreut 200 Kunden mit je einem Gerät. Von 100 Geräten fällt pro Tag durchschnittlich eines aus. Wie viele Ersatzgeräte braucht es, damit mit mindestens 90 % bei jeder Reparatur eines bereitsteht?", "gesucht": "k", "ort": "sonst", "soll": {"ketten": [{"n": 200, "p": {"t": "0.01", "w": 0.01}, "iv": [0, "k"], "spiegel": null}], "frage": "k", "P": {"t": "≥ 90 %", "w": 0.9}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "kleinstes k mit P(X ≤ k) ≥ 90 %: k = 4 (94.8 %; bei 3: 85.8 %)", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": "P(X ≤ <mark class=\"m-k\">k</mark>) = <span class=\"bn-sig\">Σ<span><sup><mark class=\"m-k\">k</mark></sup><sub>i = 0</sub></span></span> <span class=\"bn-binom\"><span><span>200</span><span>i</span></span></span> · 0.01<sup>i</sup> · 0.99<sup>200 − i</sup> ≥ 0.9"}, {"id": "K16", "quelle": "Aufgabe 7.7", "kurz": "Aufgabe 7.7 Glücksritter", "text": "Teil I: 10 Fragen mit je 5 Antworten, eine richtig. Teil II: 5 Fragen mit je 5 Antworten, genau zwei richtig (beide ankreuzen). Bestanden mit mindestens 5 in I und mindestens 2 in II. Wie wahrscheinlich besteht, wer nur rät?", "gesucht": "P", "ort": "Pb", "soll": {"ketten": [{"n": 10, "p": {"t": "0.2", "w": 0.2}, "iv": [5, 10], "spiegel": [0, 5]}, {"n": 5, "p": {"t": "0.1", "w": 0.1}, "iv": [2, 5], "spiegel": [0, 3]}], "frage": "P", "P": "?", "frei": false}, "fehler": [{"iv": [[6, 10], [3, 5]], "art": "falsch", "text": "«Mindestens 5» und «mindestens 2» schliessen die Grenze ein."}], "pruefen": false, "notiz": "Zwei Ketten: I ist B(10; 1/5), II ist B(5; 1/10).", "loesung": "P(X ≥ 5) · P(Y ≥ 2) ≈ 3.3 % · 8.1 % ≈ 0.27 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": true, "bild": null, "formel": null}, {"id": "K04", "quelle": "Aufgabe 7.1 B", "kurz": "Aufgabe 7.1 B", "text": "Ein Würfel wird viermal geworfen. Wie wahrscheinlich sind genau zwei Sechsen?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 4, "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": [2, 2], "spiegel": [2, 2]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(4; 1/6), X = 2: P ≈ 11.6 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X = 2)</mark> = <span class=\"bn-binom\"><span><span>4</span><span>2</span></span></span> · (1/6)<sup>2</sup> · (5/6)<sup>2</sup>"}, {"id": "K05", "quelle": "Aufgabe 7.1 C", "kurz": "Aufgabe 7.1 C", "text": "Ein Würfel wird viermal geworfen. Wie wahrscheinlich sind genau drei Sechsen?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 4, "p": {"t": "1/6", "w": 0.16666666666666666}, "iv": [3, 3], "spiegel": [1, 1]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(4; 1/6), X = 3: P ≈ 1.54 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X = 3)</mark> = 4 · (1/6)<sup>3</sup> · (5/6)"}, {"id": "K09", "quelle": "Aufgabe 7.5 a", "kurz": "Aufgabe 7.5 a", "text": "Ein Kundendienst betreut 200 Kunden mit je einem Gerät. Von 100 Geräten fällt pro Tag durchschnittlich eines aus. Wie wahrscheinlich wird an einem Tag kein Ersatzgerät verliehen?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 200, "p": {"t": "0.01", "w": 0.01}, "iv": [0, 0], "spiegel": [200, 200]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(200; 0.01), X = 0: P = 0.99²⁰⁰ ≈ 13.4 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X = 0)</mark> = 0.99<sup>200</sup>"}, {"id": "K10", "quelle": "Aufgabe 7.5 b", "kurz": "Aufgabe 7.5 b", "text": "Ein Kundendienst betreut 200 Kunden mit je einem Gerät. Von 100 Geräten fällt pro Tag durchschnittlich eines aus. Drei Ersatzgeräte sind auf Vorrat. Wie wahrscheinlich gibt es an einem Tag mehr Reparaturen als Ersatzgeräte?", "gesucht": "P", "ort": "Pb", "soll": {"ketten": [{"n": 200, "p": {"t": "0.01", "w": 0.01}, "iv": [4, 200], "spiegel": [0, 196]}], "frage": "P", "P": "?", "frei": false}, "fehler": [{"iv": [[3, 200]], "art": "falsch", "text": "«Mehr als 3» heisst X > 3, also X ≥ 4. Die 3 gehört nicht dazu."}], "pruefen": false, "notiz": "", "loesung": "P(X ≥ 4) = 1 − P(X ≤ 3) ≈ 14.2 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X ≥ 4)</mark> = 1 − [0.99<sup>200</sup> + 200 · 0.01 · 0.99<sup>199</sup> + <span class=\"bn-binom\"><span><span>200</span><span>2</span></span></span> · 0.01<sup>2</sup> · 0.99<sup>198</sup> + <span class=\"bn-binom\"><span><span>200</span><span>3</span></span></span> · 0.01<sup>3</sup> · 0.99<sup>197</sup>]"}, {"id": "K12", "quelle": "Aufgabe 7.6 a", "kurz": "Aufgabe 7.6 a", "text": "Ein Gepäckstück geht mit Wahrscheinlichkeit p nach Zürich. Von zwei Stücken geht mit 93.75 % mindestens eines nicht nach Zürich. Wie gross ist p?", "gesucht": "p", "ort": "m1", "soll": {"ketten": [{"n": 2, "p": "?", "iv": [0, 1], "spiegel": [1, 2]}], "frage": "p", "P": {"t": "93.75 %", "w": 0.9375}, "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "1 − p² = 0.9375 ⇒ p = 0.25", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "P(X ≤ 1) = (1 − <mark class=\"m-p\">p</mark>)<sup>2</sup> + 2 · <mark class=\"m-p\">p</mark> · (1 − <mark class=\"m-p\">p</mark>) = 15/16"}, {"id": "K13", "quelle": "Aufgabe 7.6 b A", "kurz": "Aufgabe 7.6 b A", "text": "Zehn Gepäckstücke; jedes geht mit p = 0.25 nach Zürich. Wie wahrscheinlich gehen genau drei nach Zürich?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 10, "p": {"t": "0.25", "w": 0.25}, "iv": [3, 3], "spiegel": [7, 7]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(10; 0.25), X = 3: P ≈ 25.0 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X = 3)</mark> = <span class=\"bn-binom\"><span><span>10</span><span>3</span></span></span> · 0.25<sup>3</sup> · 0.75<sup>7</sup>"}, {"id": "K14", "quelle": "Aufgabe 7.6 b B", "kurz": "Aufgabe 7.6 b B", "text": "Zehn Gepäckstücke; jedes geht mit p = 0.25 nach Zürich. Wie wahrscheinlich ist das 10. Stück das dritte nach Zürich?", "gesucht": "P", "ort": "keine", "soll": {"ketten": [{"n": 10, "p": {"t": "0.25", "w": 0.25}, "iv": "–", "spiegel": null}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": true, "notiz": "Binomialformel für die ersten neun, mal p für das zehnte.", "loesung": "P(zwei in den ersten 9) · 0.25 ≈ 7.5 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": null}, {"id": "K15", "quelle": "Aufgabe 7.6 b C", "kurz": "Aufgabe 7.6 b C", "text": "Zehn Gepäckstücke; jedes geht mit p = 0.25 nach Zürich. Wie wahrscheinlich gehen genau drei nach Zürich, und zwar direkt hintereinander?", "gesucht": "P", "ort": "keine", "soll": {"ketten": [{"n": 10, "p": {"t": "0.25", "w": 0.25}, "iv": "–", "spiegel": null}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "8 Lagen des Blocks: 8 · 0.25³ · 0.75⁷ ≈ 1.67 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": null}, {"id": "K17", "quelle": "Kap. 6 · Garderobe", "kurz": "Garderobe", "text": "Anna, Ben und Clara bekommen ihre drei Jacken zufällig vertauscht zurück. Wie wahrscheinlich bekommt genau eine Person ihre eigene Jacke?", "gesucht": "P", "ort": "keine", "soll": {"ketten": [{"n": 3, "p": null, "iv": "–", "spiegel": null}], "frage": "P", "P": "?", "frei": true}, "fehler": [], "pruefen": false, "notiz": "Keine Bernoulli-Kette: Wer die falsche Jacke hat, nimmt sie jemand anderem weg.", "loesung": "abgezählt (Kapitel 6): P(X = 1) = 1/2", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": null}, {"id": "K18", "quelle": "Kap. 6 · Faden", "kurz": "Drei Abende", "text": "Drei Freunde gehen an drei verschiedenen Abenden aus. Jeder bekommt an der Garderobe zufällig eine von drei Jacken zurück, eine davon ist seine. Wie wahrscheinlich bekommt genau einer seine eigene?", "gesucht": "P", "ort": "Pk", "soll": {"ketten": [{"n": 3, "p": {"t": "1/3", "w": 0.3333333333333333}, "iv": [1, 1], "spiegel": [2, 2]}], "frage": "P", "P": "?", "frei": false}, "fehler": [], "pruefen": false, "notiz": "", "loesung": "B(3; 1/3), X = 1: P = 4/9 ≈ 44.4 %", "knacknuss": null, "faelle": null, "zug": 2, "pflicht": false, "bild": null, "formel": "<mark class=\"m-P\">P(X = 1)</mark> = 3 · (1/3) · (2/3)<sup>2</sup>"}], "faecher": [{"ort": "Pk", "name": "P gesucht, X = k"}, {"ort": "Pb", "name": "P gesucht, Bereich"}, {"ort": "m1", "name": "n oder p gesucht, mindestens 1"}, {"ort": "sonst", "name": "n, p oder Grenze k gesucht, sonst"}], "ablage": {"ort": "keine", "name": "Keine Binomialaufgabe"}, "schreibfrage": "Kann man das Gesuchte direkt ausrechnen, oder muss man ausprobieren? Warum?", "formelKopf": "Die Formel, das Gesuchte markiert", "sicht": {"wege": ["Bernoullische Formel", "erweiterte Bernoullische Formel (Summe, auch über das Gegenereignis)", "geschlossen auflösen bei «mindestens 1»", "austesten: einsetzen, bis die Wahrscheinlichkeit passt"], "faecher": {"Pk": "mit der Bernoullischen Formel: P(X = k) = (n über k) · pᵏ · (1 − p)ⁿ⁻ᵏ.", "Pb": "mit der erweiterten Bernoullischen Formel: die Summe über alle k im Bereich, oft kürzer über das Gegenereignis.", "m1": "geschlossen: P(X ≥ 1) = 1 − (1 − p)ⁿ, nach n oder p auflösen.", "sonst": "Eine Formel zum Auflösen gibt es nicht. Man setzt Werte ein und testet aus, bis die Wahrscheinlichkeit passt.", "keine": "Die Bernoullische Formel fragt nur, wie viele Treffer es sind. Sie passt nicht, wenn es auch darauf ankommt, wo die Treffer liegen (feste Reihenfolge, «das 10. ist das dritte», «direkt hintereinander»), oder wenn die Versuche voneinander abhängen (die Garderobe, das Ziehen ohne Zurücklegen an der Losbude). Dann zählt man Pfade."}, "chilbi": "An der Chilbi", "skript": "Aus dem Skript"}, "marken": [{"art": "n", "name": "n"}, {"art": "p", "name": "p"}, {"art": "k", "name": "k"}, {"art": "P", "name": "P"}], "kformen": [{"form": "eq", "text": "X = k"}, {"form": "le", "text": "X ≤ k"}, {"form": "ge", "text": "X ≥ k"}, {"form": "bereich", "text": "a ≤ X ≤ b"}], "sig": {"sname": "Die Würfelbude", "lage": "In Etappe 1 blieben Fragen offen, die man nur durch Austesten beantworten kann: am Ballonstand, am Greifautomaten, beim Penaltyschiessen und an der Würfelbude. Zuerst testen Sie sie mit einem Rechner aus. Dann fragt Ben: «Geht das auch schneller?»", "frage": "Gibt es eine Abkürzung fürs Austesten?", "zuege": {"1": "Austesten", "2": "Ein festes Band?", "3": "Das Band in σ", "4": "Umgekehrt gefragt"}, "zuege_kurz": {"1": "Austesten", "2": "Ein festes Band?", "3": "Das Band in σ", "4": "Umgekehrt gefragt"}, "zt_sname": "Vier offene Fragen", "zt_frage": "Wie findet man die Antworten durch Austesten?", "abk_lage": "Bei der Würfelbude mussten Sie lange tasten, bis der Bereich um 100 mit 95 % stand. Ben fragt: «Geht das auch schneller?»", "jetzt": {"1": "Lösen Sie die Aufgabe mit dem Rechner: Werte eintragen, mit «−» und «+» weitertasten, bis P passt.", "2": "Ben sagt: «Mit 95 % liegt man höchstens 10 Sechsen neben μ.» Verstellen Sie n und notieren Sie, wie viel im Band μ ± 10 liegt.", "3": "Messen Sie das Band in σ: zuerst schätzen, dann mit n und p spielen und notieren.", "4": "Ben will 95 %. Schieben Sie c, bis P die Sicherheit gerade erreicht. Dann rechnen Sie die Würfelbude mit μ ± 2σ."}, "aufgabe_von": "Aufgabe {n} von {m}", "werkzeug": "Histogramm", "toleranz_c": 0.3, "w": {"n": "n", "p": "p", "c": "c", "n_titel": "Anzahl Versuche n (10 bis 6000). Regler mit den Pfeiltasten fein verstellen, oder eine Zahl eintippen.", "p_titel": "Trefferwahrscheinlichkeit p (0.01 bis 0.99). Auch 1/6 lässt sich eintippen.", "c_titel": "Breite des Bandes in σ (0.5 bis 3.5)", "notieren": "Notieren", "schon": "Das steht schon in der Tabelle.", "weg": "Zeile streichen", "im_band": "P({a} ≤ X ≤ {b}) = {P}", "leer_band": "Im Band liegt keine ganze Trefferzahl.", "verdeckt": "Erst schätzen, dann zeigt das Werkzeug P."}, "zt": {"text": "Diese Aufgaben aus Etappe 1 lassen sich nur durch Austesten lösen. Lösen Sie sie mit dem Rechner B(n; p): Werte eintragen, mit «−» und «+» weitertasten, bis P passt. Mit «Notieren» halten Sie einen Versuch fest.", "rechner": "Rechner B(n; p)", "form": "Form", "breiter": "breiter", "enger": "enger", "beide": "beide ±1:", "beide_titel": "a − 1 und b + 1 zusammen (breiter) oder a + 1 und b − 1 (enger)", "minus": "um 1 kleiner", "plus": "um 1 grösser", "minus_p": "um 0.01 kleiner", "plus_p": "um 0.01 grösser", "leer": "Im Bereich liegt keine ganze Trefferzahl.", "n_falsch": "n: eine ganze Zahl von 1 bis {N}", "p_falsch": "p: eine Zahl zwischen 0.01 und 0.99, auch 1/6", "versuche": "Ihre Versuche", "tab_n": "n", "tab_p": "p", "tab_b": "Bereich", "tab_P": "P", "schon": "Dieser Versuch steht schon in der Liste.", "keine": "Noch keine Versuche.", "weg": "Versuch streichen", "legende": "Balken: P(X = k) · eingefärbt: k liegt im Bereich", "antwort": {"k": "Ersatzballone: k =", "n": "Versuche: n =", "p": "Trefferwahrscheinlichkeit: p =", "bereich": "Bereich:"}, "zusatz": {"p": "auf zwei Dezimalen"}, "kleinst": {"k": "das kleinste k", "n": "das kleinste n", "p": "das kleinste p auf zwei Dezimalen", "bereich": "der kleinste Bereich"}, "pruefen": "Prüfen", "leer_antwort": "Tragen Sie zuerst eine Antwort ein.", "richtig": "Das stimmt: {ereignis} = {P}. Bei {vor} wären es erst {vP}.", "nicht": "Bei {wert}: {ereignis} = {P}. Das reicht noch nicht.", "mehr": "Bei {wert} reicht es ({P}), aber es geht knapper. Gesucht ist {kleinst}.", "sonst": "Das stimmt noch nicht. Testen Sie weiter: Gesucht ist {kleinst}, bei dem P mindestens {S} % erreicht.", "schief": "Der Bereich soll um 100 liegen und nach unten und oben gleich weit reichen.", "frage": "Was war mühsam?", "abkuerzung": "Bei der Würfelbude mussten Sie lange tasten. Gibt es eine Abkürzung?", "loesung": "Jeder Versuch heisst: einen Wert ändern, P neu ablesen und mit der Sicherheit vergleichen. An der Würfelbude braucht es viele Schritte, bis der Bereich breit genug ist, und man weiss vorher nicht, wo man anfangen soll."}, "z1": {"text": "Ben behauptet: «Mit 95 % liegt man höchstens 10 Sechsen neben dem Erwartungswert.» Das Band ist also μ ± 10, egal wie oft man würfelt. Probieren Sie verschiedene n aus und notieren Sie, wie viel im Band liegt.", "ben": "Bens Band: μ ± 10", "aufgabe": "Notieren Sie mindestens {m} verschiedene n.", "tab_n": "n", "tab_mu": "μ", "tab_band": "Band", "tab_P": "P im Band", "frage": "Stimmt Bens Regel? Wovon müsste die Breite des Bandes abhängen?", "sigma": "Die Streuung kennen Sie aus Kapitel 6: σ. Was passiert, wenn man die Breite in σ misst?", "mind": 4, "legende": "Balken: P(X = k) · eingefärbt: k liegt im Band · schraffiert: μ ± 10", "loesung": "Nein. Bei kleinem n stimmt sie, bei grossem n liegt viel weniger als 95 % im Band (bei 6000 Würfen nur noch 28.4 %). Je öfter man würfelt, desto breiter streut die Anzahl Sechsen. Die Breite des Bandes müsste mit der Streuung wachsen, also von n und p abhängen."}, "z2": {"text": "Jetzt ist das Band μ ± c · σ breit. Der σ-Stab unter dem Histogramm zeigt die Breite. Zuerst schätzen Sie, dann spielen Sie mit n und p und notieren.", "wahl": "Band:", "schaetzen": "Wie viel Prozent liegen im Band μ ± {c}?", "schaetzen_knopf": "Schätzung festhalten", "schaetzen_leer": "Tragen Sie zuerst eine Schätzung ein.", "ihre": "Ihre Schätzung: {t}", "aufgabe": "Notieren Sie mindestens {m} verschiedene Paare (n, p).", "weiter_c": "Weiter mit {c}: zuerst schätzen.", "erst": "Erst {c} fertig: {m} Paare notieren.", "tab_n": "n", "tab_p": "p", "tab_s": "σ", "tab_P": "P im Band", "frage": "Was fällt Ihnen auf? Wann stimmt es weniger gut?", "legende": "Balken: P(X = k) · eingefärbt: k liegt im Band · schraffiert: μ ± c · σ · darunter: der σ-Stab", "loesung_schaetzung": {"1": "etwa 70 %", "2": "etwa 95 %", "3": "fast 100 %"}, "loesung": "Im Band μ ± 1σ liegen immer etwa zwei Drittel, in μ ± 2σ etwa 95 %, in μ ± 3σ fast alles, ganz gleich, welche n und p. Weniger gut stimmt es, wenn σ klein ist (wenige Versuche oder p nahe bei 0 oder 1): Dann liegen nur wenige ganze Balken im Band, und einer mehr oder weniger macht viel aus."}, "z3": {"text": "«Ben will 95 %. Wie viele σ braucht er?» Stellen Sie n und p ein, wie Sie möchten, und schieben Sie c, bis P die Sicherheit gerade erreicht. Dann dasselbe für 90 % und für 99 %.", "ansichten": {"95": "95 %", "90": "90 %", "99": "99 %", "abk": "Die Abkürzung"}, "frage_s": "Ab welchem c liegen mindestens {S} % im Band?", "etwa": "c = etwa", "zeigen": "Eintragen", "leer": "Tragen Sie zuerst ein, welches c Sie gefunden haben.", "genau": "Bei n = {n}, p = {p} erreicht P die {S} % ab c = {c}.", "nie": "Bei n = {n}, p = {p} erreicht P die {S} % mit c bis 3.5 nicht.", "passt": "Das passt.", "daneben": "Schieben Sie c noch einmal langsam, bis P gerade {S} % erreicht.", "tab_S": "Sicherheit", "tab_ihr": "Ihr c", "tab_genau": "ab c (bei n, p)", "abk_kopf": "Die Abkürzung", "abk_text": "Für 95 % reicht etwa c = 2. Zurück zur Würfelbude: 600 Würfe, p = 1/6. Rechnen Sie die Grenzen ohne Austesten aus.", "abk_zart": "Erst c für 95 %, 90 % und 99 % finden.", "felder": [{"w": "mu", "name": "μ", "titel": "Erwartungswert"}, {"w": "s", "name": "σ", "titel": "Zahl oder Rechnung"}, {"w": "unten", "name": "μ − 2σ", "titel": "Zahl oder Rechnung"}, {"w": "oben", "name": "μ + 2σ", "titel": "Zahl oder Rechnung"}, {"w": "a", "name": "a", "titel": "ganze Zahl"}, {"w": "b", "name": "b", "titel": "ganze Zahl"}], "bereich": "Der Bereich [a; b]:", "ganz": "Es zählen nur die ganzen Trefferzahlen k, die im Band liegen: Welche ganzen Zahlen liegen zwischen {u} und {o}?", "zart": "In den Feldern darf eine Rechnung stehen, z. B. √(600 · 1/6 · 5/6). Auf zwei Stellen genau genügt.", "vergleich_kopf": "Die Würfelbude", "vergle
