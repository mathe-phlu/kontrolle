rage": "g", "c": 2.33, "mu_t": "60", "s_t": "7.63", "p_text": "0.03", "rechnung": {"mu": "2000 · 0.03", "s": "√(2000 · 0.03 · 0.97)"}, "werte": ["k ≈ 77.78"]}, "gleichung": [["X ≤ 60 + 2.33 · 7.63", "haupt"]], "ergebnis": "k ≈ 77.78, aufgerundet k = 78", "vergleich": "Mit der Binomialverteilung: ebenfalls 78 Ersatzbecher.", "deutung": "Gefährlich sind nur zu viele fehlende Becher, also einseitig: 99 % links, 1 % im rechten Schwanz. Das ist das 98 %-Intervall mit c = 2.33. Wer zweiseitig mit 2.58 rechnet, kommt auf 80 und hält zu viele bereit.", "kasper": [["n", "2000 Pfandbecher"], ["p", "3 %"], ["Grenze", "Wie viele Ersatzbecher"], ["Sicherheit", "99 %"]], "hinweise_p": [], "rechnung": [["X ≤ 60 + 2.33 · 7.63", "haupt"], ["Die Grenze k ist die rechte Seite:", "satz"], ["k = 60 + 2.33 · 7.63 ≈ 77.78", "zeile"], ["X ist eine ganze Zahl. Damit die Sicherheit bleibt, wird aufgerundet:", "satz"], ["k = 78", "ergebnis"]], "strahl": null, "erg": {"art": "k", "rel": "", "w": 78, "roh": 77.77531940641293, "runden": "auf"}, "folge": "k = 78", "fuehrung": null, "hinweise_k": []}, {"id": "N3", "titel": "Autoscooter", "quelle": "", "text": "Am Autoscooter verteilt Ben Chips für eine Gratisfahrt. Erfahrungsgemäss wird ein Chip mit Wahrscheinlichkeit 80 % eingelöst. An einem Abend schafft der Autoscooter höchstens 400 Gratisfahrten. Wie viele Chips darf Ben höchstens verteilen, damit mit 99 % Sicherheit nicht mehr als 400 eingelöst werden?", "typ": "n", "c_liste": [1.64, 1.96, 2.33, 2.58], "angaben": {"n": null, "p": 0.8, "grenze": 400, "sicherheit": 99, "seiten": "ein", "lage": "oben", "frage": "n", "c": 2.33, "mu_t": "0.8n", "s_t": "√(0.16n)", "p_text": "0.8", "rechnung": null, "werte": []}, "gleichung": [["0.8n + 2.33 · √(0.16n) ≤ 400", "haupt"]], "ergebnis": "n ≤ 474.62, also n ≤ 474", "vergleich": "Mit der Binomialverteilung dürfte Ben 475 Chips verteilen.", "deutung": "B(n; 0.8) ist nach links schief: Der rechte Schwanz ist kürzer, als die Glockenkurve annimmt. Die Näherung überschätzt also die Gefahr, dass zu viele Chips eingelöst werden, und erlaubt einen Chip weniger. Für den Autoscooter ist das die vorsichtige Seite.", "kasper": [["n", "Wie viele Chips"], ["p", "80 %"], ["Grenze", "höchstens 400 Gratisfahrten"], ["Sicherheit", "99 %"]], "hinweise_p": [], "rechnung": [["0.8n + 2.33 · √(0.16n) ≤ 400", "haupt"], ["Mit x = √n ist n = x² und √(0.16n) = 0.4x:", "satz"], ["0.8x² + 2.33 · 0.4x ≤ 400", "zeile"], ["0.8x² + 0.932x − 400 ≤ 0", "zeile"], ["Die positive Nullstelle (Lösungsformel):", "satz"], ["x = (−0.932 + √(0.932² + 4 · 0.8 · 400)) : (2 · 0.8) ≈ 21.79", "zeile"], ["n = x² ≈ 474.62", "zeile"], ["n ist eine Anzahl. Damit die Sicherheit bleibt, wird abgerundet:", "satz"], ["n ≤ 474", "ergebnis"]], "strahl": null, "erg": {"art": "n", "rel": "≤", "w": 474, "roh": 474.6195830682434, "runden": "ab"}, "folge": "n ≤ 474", "fuehrung": null, "hinweise_k": [[401, "Nicht mehr als 400 heisst X ≤ 400."], [1, "1 % ist das Risiko, nicht die Grenze. Die Grenze sind die Gratisfahrten."]]}, {"id": "P2", "titel": "Chilbi-Umfrage", "quelle": "", "text": "Die Chilbi-Organisation befragt am letzten Abend 500 Besucherinnen und Besucher. 420 davon sind zufrieden. Welche Anteile p zufriedener Besucherinnen und Besucher sind mit diesem Ergebnis verträglich? (95 %)", "typ": "p", "c_liste": [1.64, 1.96, 2.33, 2.58], "angaben": {"n": 500, "p": null, "grenze": 420, "sicherheit": 95, "seiten": "zwei", "lage": null, "frage": "p", "c": 1.96, "mu_t": "500p", "s_t": "√(500p(1 − p))", "p_text": null, "rechnung": null, "werte": ["p₁ ≈ 0.8053", "p₂ ≈ 0.8695"]}, "gleichung": [["|420 − 500p| ≤ 1.96 · √(500p(1 − p))", "haupt"]], "ergebnis": "0.8053 ≤ p ≤ 0.8695, gerundet 0.806 ≤ p ≤ 0.869", "vergleich": "Mit der Binomialverteilung: etwa 0.805 ≤ p ≤ 0.871.", "deutung": "Zweiseitig, denn das wahre p kann grösser oder kleiner sein als die 84 % der Stichprobe. Jede Hälfte der Ungleichung liefert eine Grenze für p. Mit σ ≈ 8 liegt die Glockenkurve gut auf der Binomialverteilung, darum stimmen die Bereiche fast überein.", "kasper": [["n", "500 Besucherinnen und Besucher"], ["p", "Anteile p"], ["Grenze", "420"], ["Sicherheit", "95 %"]], "hinweise_p": [[0.84, "420 von 500 sind 84 %. Das ist das Ergebnis der Umfrage; gesucht sind die p, die dazu passen."]], "rechnung": [["|420 − 500p| ≤ 1.96 · √(500p(1 − p))", "haupt"], ["Beide Seiten sind nicht negativ. Quadrieren:", "satz"], ["(420 − 500p)² ≤ 1.96² · 500p(1 − p)", "zeile"], ["Ausmultiplizieren und ordnen:", "satz"], ["251920.8p² − 421920.8p + 176400 ≤ 0", "zeile"], ["Die Nullstellen (Lösungsformel):", "satz"], ["p₁ ≈ 0.8053     p₂ ≈ 0.8695", "zeile"], ["Die Parabel ist nach oben offen; ≤ 0 gilt zwischen den Nullstellen. Nach innen gerundet, damit jedes p darin verträglich ist:", "satz"], ["0.806 ≤ p ≤ 0.869", "ergebnis"]], "strahl": null, "erg": {"art": "pp", "rel": "", "w": [0.806, 0.869], "roh": [0.8052911368285659, 0.8695241225704199], "runden": "innen"}, "folge": "0.806 ≤ p ≤ 0.869", "fuehrung": null, "hinweise_k": [[0.84, "0.84 ist ein Anteil. In die Ungleichung gehört die Anzahl, wie μ = 500 · p."], [84, "84 % ist ein Anteil. In die Ungleichung gehört die Anzahl, wie μ = 500 · p."], [500, "500 ist die Zahl der Befragten, nicht das Ergebnis."]]}], "glocke": [[-3.6, 0.00153], [-3.55, 0.00183], [-3.5, 0.00219], [-3.45, 0.0026], [-3.4, 0.00309], [-3.35, 0.00366], [-3.3, 0.00432], [-3.25, 0.00509], [-3.2, 0.00598], [-3.15, 0.007], [-3.1, 0.00819], [-3.05, 0.00955], [-3.0, 0.01111], [-2.95, 0.01289], [-2.9, 0.01492], [-2.85, 0.01723], [-2.8, 0.01984], [-2.75, 0.02279], [-2.7, 0.02612], [-2.65, 0.02986], [-2.6, 0.03405], [-2.55, 0.03873], [-2.5, 0.04394], [-2.45, 0.04972], [-2.4, 0.05613], [-2.35, 0.06321], [-2.3, 0.07101], [-2.25, 0.07956], [-2.2, 0.08892], [-2.15, 0.09914], [-2.1, 0.11025], [-2.05, 0.1223], [-2.0, 0.13534], [-1.95, 0.14938], [-1.9, 0.16447], [-1.85, 0.18064], [-1.8, 0.1979], [-1.75, 0.21627], [-1.7, 0.23575], [-1.65, 0.25634], [-1.6, 0.27804], [-1.55, 0.30082], [-1.5, t": "1/6", "x": 125, "seite": "zwei", "sicherheit": 95, "c": 1.96, "mu": 100.0, "s": 9.128709291752768, "a": 82, "b": 118, "a_genau": 82.10772978816458, "b_genau": 117.89227021183542, "drin": false, "entscheid": "ver", "bereich": "82 bis 118", "sache": "125 Sechsen sind mit einem fairen Würfel kaum noch zu erklären. Man verwirft die Behauptung, der Würfel ist verdächtig – sicher ist es nicht.", "fuehrung": {"behauptung": "Die Behauptung «fair» heisst p = 1/6. Dazu n = 600 Würfe und das beobachtete Ergebnis X = 125.", "seite": "Ein gezinkter Würfel kann zu viele oder zu wenige Sechsen liefern: zweiseitig.", "bereich": "Rechnen Sie wie in Etappe 2, aber mit dem p der Behauptung: μ = n · p, σ = √(n · p · (1 − p)), Grenzen μ ± c · σ.", "entscheid": "Liegt X im Bereich, ist das Ergebnis mit der Behauptung verträglich. Liegt es draussen, verwirft man sie."}}, {"id": "T2", "titel": "Glücksrad", "quelle": "", "text": "Am Glücksrad steht: «Jedes vierte Feld gewinnt.» Anna dreht 200-mal und gewinnt 44-mal. Stimmt das Schild noch? (Sicherheit 95 %)", "n": 200, "p": 0.25, "p_text": "0.25", "x": 44, "seite": "zwei", "sicherheit": 95, "c": 1.96, "mu": 50.0, "s": 6.123724356957945, "a": 37, "b": 63, "a_genau": 37.99750026036243, "b_genau": 62.00249973963757, "drin": true, "entscheid": "bei", "bereich": "37 bis 63", "sache": "44 Gewinne liegen im Bereich. Das Ergebnis ist mit dem Schild verträglich; man glaubt ihm weiter. Bewiesen ist es nicht.", "fuehrung": null}, {"id": "T3", "titel": "Losbude", "quelle": "", "text": "Die Losbude verspricht: «Jedes fünfte Los gewinnt.» Clara vermutet, es seien weniger. Unter 400 verkauften Losen zählt sie 62 Gewinne. Hat Clara recht? (Sicherheit 95 %)", "n": 400, "p": 0.2, "p_text": "0.2", "x": 62, "seite": "wenig", "sicherheit": 95, "c": 1.64, "mu": 80.0, "s": 8.0, "a": 66, "b": null, "a_genau": 66.88, "b_genau": 93.12, "drin": false, "entscheid": "ver", "bereich": "ab 66", "sache": "Clara vermutet weniger, also zählen nur zu wenige Gewinne gegen das Versprechen. 62 liegt darunter: Man verwirft das Versprechen, Claras Verdacht ist begründet.", "fuehrung": null}, {"id": "T4", "titel": "Entenfischen", "quelle": "", "text": "Beim Entenfischen hat laut Betreiber jede vierte Ente einen Stern. Ben vermutet, es seien mehr. Von 300 gefischten Enten haben 84 einen Stern. Hat Ben recht? (Sicherheit 95 %)", "n": 300, "p": 0.25, "p_text": "0.25", "x": 84, "seite": "viel", "sicherheit": 95, "c": 1.64, "mu": 75.0, "s": 7.5, "a": null, "b": 88, "a_genau": 62.7, "b_genau": 87.3, "drin": true, "entscheid": "bei", "bereich": "bis 88", "sache": "84 ist mehr als 75, aber noch im Bereich. Das reicht nicht, um dem Betreiber zu widersprechen; Bens Vermutung ist damit nicht belegt.", "fuehrung": null}, {"id": "T5", "titel": "8.4 Partei B", "quelle": "Aufgabe 8.4", "text": "Bei der letzten Wahl erhielt Partei B 22 % der Stimmen. Drei Monate später sagen in einer Umfrage 153 von 800 Personen, sie würden Partei B wieder wählen. Hat Partei B an Stimmen verloren? (α = 5 %)", "n": 800, "p": 0.22, "p_text": "0.22", "x": 153, "seite": "wenig", "sicherheit": 95, "c": 1.64, "mu": 176.0, "s": 11.716654812701448, "a": 156, "b": null, "a_genau": 156.78468610716962, "b_genau": 195.21531389283038, "drin": false, "entscheid": "ver", "bereich": "ab 156", "sache": "Gefragt ist nur nach einem Verlust, also einseitig. 153 liegt unter dem Bereich: Man verwirft «noch 22 %». Die Umfrage spricht für einen Verlust.", "fuehrung": null}, {"id": "T6", "titel": "8.5 Schuhe am Strand", "quelle": "Aufgabe 8.5", "text": "Ein Biologe behauptet, linke und rechte Schuhe trieben im Meer in verschiedene Richtungen. Auf der Insel Texel wurden 107 Schuhe angespült, 68 linke und 39 rechte. Spricht das gegen «gleich viele linke wie rechte»? (α = 5 %)", "n": 107, "p": 0.5, "p_text": "0.5", "x": 68, "seite": "zwei", "sicherheit": 95, "c": 1.96, "mu": 53.5, "s": 5.172040216394301, "a": 43, "b": 64, "a_genau": 43.36280117586717, "b_genau": 63.63719882413283, "drin": false, "entscheid": "ver", "bereich": "43 bis 64", "sache": "Die Behauptung, die geprüft wird, ist «gleich viele», also p = 0.5 für linke Schuhe. 68 liegt ausserhalb: Man verwirft sie. Das stützt den Biologen, beweist ihn aber nicht.", "fuehrung": null}], "seiten": [["zwei", "zweiseitig: zu viel oder zu wenig"], ["wenig", "nur zu wenig"], ["viel", "nur zu viel"]], "felder": [{"id": "st_bei", "wahr": "stimmt", "ent": "beibehalten", "name": "richtig entschieden"}, {"id": "nst_bei", "wahr": "stimmt nicht", "ent": "beibehalten", "name": "Fehler 2. Art"}, {"id": "st_ver", "wahr": "stimmt", "ent": "verworfen", "name": "Fehler 1. Art"}, {"id": "nst_ver", "wahr": "stimmt nicht", "ent": "verworfen", "name": "richtig entschieden"}], "tafel": {"spalten": ["Die Behauptung stimmt", "Die Behauptung stimmt nicht"], "zeilen": ["beibehalten", "verworfen"]}, "geschichten": [{"id": "G1", "feld": "st_bei", "text": "Der Würfel ist fair. In 600 Würfen fallen 97 Sechsen. Man glaubt dem Besitzer."}, {"id": "G2", "feld": "st_bei", "text": "Die Losbude ist ehrlich. Clara zählt unter 400 Losen 70 Gewinne und beschwert sich nicht."}, {"id": "G3", "feld": "st_ver", "text": "Der Würfel ist fair. Zufällig fallen 125 Sechsen, und der Besitzer wird verdächtigt."}, {"id": "G4", "feld": "st_ver", "text": "Die Losbude ist ehrlich. Clara erwischt eine Serie mit nur 62 Gewinnen und beschwert sich zu Unrecht."}, {"id": "G5", "feld": "nst_bei", "text": "Der Würfel ist leicht gezinkt. In 600 Würfen fallen aber nur 108 Sechsen. Niemand merkt etwas."}, {"id": "G6", "feld": "nst_bei", "text": "Partei B ist in Wirklichkeit auf 20 % gefallen. In der Umfrage sagen 170 von 800 Ja, und man glaubt, sie stehe noch bei 22 %."}, {"id": "G7", "feld": "nst_ver", "text": "Der Würfel ist gezinkt. Es fallen 140 Sechsen, und der Besitzer wird zu Recht verdächtigt."}, {"id": "G8", "feld": "nst_ver", "text": "Die Losbude schummelt. Clara zählt unter 400 Losen 55 Gewinne und beschwert sich zu Recht."}], "irrtum_frage": {"frage": "Ein Test mit 5 %: Welcher der beiden Fehler ist mit den 5 % gemeint?", "wahl": [["1", "Fehler 1. Art"], ["2", "Fehler 2. Art"]], "richtig": "1", "sicht": "Die 5 % sind die Wahrscheinlichkeit, eine richtige Behauptung zu verwerfen: der Fehler 1. Art. Wie oft man eine falsche Behauptung übersieht (Fehler 2. Art), hängt davon ab, wie falsch sie ist – darum lässt er sich nicht festlegen."}, "saetze": [{"id": "V1", "stimmt": false, "satz": "Der Würfel wurde im Test nicht verworfen. Also ist er fair.", "warum": "Nicht verworfen heisst nur: Das Ergebnis ist mit einem fairen Würfel verträglich. Ein leicht gezinkter Würfel liefert oft auch solche Ergebnisse (Fehler 2. Art). Beweisen kann ein Test nichts."}, {"id": "V2", "stimmt": false, "satz": "Bei 125 Sechsen in 600 Würfen ist sicher, dass der Würfel gezinkt ist.", "warum": "125 liegt ausserhalb von [82; 118], darum verwirft man. Sicher ist es nicht: Auch ein fairer Würfel liefert in etwa 5 % der Serien ein Ergebnis ausserhalb (Fehler 1. Art)."}, {"id": "V3", "stimmt": true, "satz": "Testet man viele faire Würfel mit dem Signifikanzniveau 5 %, verwirft man etwa jeden zwanzigsten zu Unrecht.", "warum": "Das Signifikanzniveau ist die Wahrscheinlichkeit, eine richtige Behauptung zu verwerfen. 5 % ist jeder zwanzigste."}, {"id": "V4", "stimmt": false, "satz": "Wurde die Behauptung verworfen, ist sie mit 95 % Wahrscheinlichkeit falsch.", "warum": "Die 5 % sagen, wie oft man verwirft, WENN die Behauptung stimmt. Wie wahrscheinlich sie falsch ist, NACHDEM man verworfen hat, ist die Frage rückwärts – wie P_A(B) gegen P_B(A) in Kapitel 5. Die beantwortet der Test nicht."}, {"id": "V5", "stimmt": true, "satz": "Wer statt 5 % nur 1 % zulässt, verwirft seltener zu Unrecht, übersieht aber öfter einen gezinkten Würfel.", "warum": "Mit 1 % wird der Bereich breiter (c = 2.58 statt 1.96). Man verwirft seltener: weniger Fehler 1. Art, dafür mehr Fehler 2. Art."}, {"id": "V6", "stimmt": true, "satz": "Ob man einseitig oder zweiseitig prüft, kann den Entscheid ändern.", "warum": "Einseitig schneidet man die ganzen 5 % auf einer Seite ab, die Grenze liegt näher bei μ (c = 1.64 statt 1.96). An der Losbude führen 65 Gewinne einseitig zum Verwerfen (Bereich ab 66), zweiseitig nicht (Bereich ab 64)."}], "sicht": ["Ein Test benutzt denselben Bereich μ ± c · σ wie Etappe 1 und 2, gerechnet mit dem p der Behauptung. Neu ist, was man damit tut: Man schaut, ob das beobachtete Ergebnis darin liegt, und entscheidet.", "Liegt es darin, behält man die Behauptung bei: Sie ist mit dem Ergebnis verträglich, bewiesen ist sie nicht. Liegt es draussen, verwirft man sie: Das Ergebnis ist mit Zufall allein kaum zu erklären, sicher ist es nicht.", "Ob man zweiseitig oder einseitig prüft, entscheidet die Frage: Wer nur «weniger» vermutet, schneidet nur auf einer Seite ab – wie die einseitigen Grenzen in Etappe 1 und 2.", "Irren kann man sich auf zwei Arten. Eine richtige Behauptung verwerfen (Fehler 1. Art) passiert höchstens so oft, wie das Signifikanzniveau zulässt. Eine falsche Behauptung übersehen (Fehler 2. Art) kann viel öfter vorkommen, vor allem, wenn sie nur ein wenig falsch ist."], "texte": {"teile": [["test", "Glauben wir es noch?"], ["irrtum", "Irrtum vorbehalten"], ["deuten", "Was sagt der Test?"]], "vorrat": "Die Karten", "spalten": "Welche Frage wird gestellt?", "antippen": "Karte antippen, dann das Feld antippen – oder ziehen.", "stimmt": "stimmt", "stimmt_nicht": "stimmt nicht", "warum": "Warum?", "begruendung": "Eine mögliche Begründung", "sicht": "Eine mögliche Sicht", "pruefen": "Prüfen", "zeigen": "Zeigen", "satz_einstieg": "Ziehen Sie jede Karte in die Spalte, deren Frage sie stellt.", "satz_test": "Notieren Sie die Behauptung, rechnen Sie ihren Bereich und entscheiden Sie.", "satz_irrtum": "Ziehen Sie jede Geschichte in das Feld der Tafel, in das sie gehört.", "satz_deuten": "Entscheiden Sie bei jedem Satz: stimmt oder stimmt nicht? Schreiben Sie kurz, warum.", "satz_fertig": "Alles stimmt. Lesen Sie «Eine mögliche Sicht».", "schritt": {"behauptung": "1 · Die Behauptung", "seite": "2 · Welche Seite?", "bereich": "3 · Der Bereich der Behauptung", "entscheid": "4 · Entscheid"}, "beibehalten": "beibehalten", "verwerfen": "verwerfen", "was_heisst": "Was heisst das in der Situation? (freiwillig)", "tafel_vorrat": "Die Geschichten", "tafel": "Die Tafel"}, "c_werte": {"90": 1.64, "95": 1.96, "98": 2.33, "99": 2.58}}, "nv": {"skarte": {"e1name": "Erst das Bild, dann die Gleichung", "e1text": "Anna, Ben und Clara sind wieder an der Chilbi. An der Quizbude, am Lebkuchenstand, am Ballonstand, an der Würfelbude und bei der Tombola stellen sich Fragen: Mit welchem Ergebnis ist zu rechnen? Wie gross muss die Stichprobe sein? Welche Anteile passen zum Ergebnis? In Kapitel 7 haben Sie gesehen: Im Band μ ± 2σ liegen etwa 95 %. Hier rechnen wir genauer, mit c = 1.96 für 95 %, und auch für andere Sicherheiten. Hinter jeder Aufgabe steht dieselbe Ungleichung |X − μ| ≤ c · σ oder eine ihrer Hälften. Danach kommen die Aufgaben aus dem Skript dazu.", "e1frage": "Wie kommt man vom Aufgabentext zur Gleichung?", "e2name": "Selbst übersetzen", "e2text": "Jetzt übersetzen Sie selbst, an fünf weiteren Ständen der Chilbi. Die erste Aufgabe, das Karussell, geht Schritt für Schritt mit Ihnen durch. Gelöst ist eine Aufgabe, wenn die Gleichung steht; das Rechnen danach ist freiwillig.", "e2frage": "Welches Bild gehört zur Aufgabe, und welche Gleichung folgt daraus?", "e3name": "Glauben wir es noch?", "e3text": "An der Chilbi wird viel versprochen: Der Würfel sei fair, jedes fünfte Los gewinne. Mit dem Bereich aus Etappe 1 und 2 lässt sich prüfen, ob ein beobachtetes Ergebnis noch zur Behauptung passt.", "e3frage": "Passt das Ergebnis noch zur Behauptung, und wie kann man sich dabei irren?", "auftrag": "Auftrag:", "einklappen": "Situation einklappen", "zeigen": "Situation zeigen"}, "sbild": {"K2": null, "AB3": null, "K1": null, "N3": null, "P2": null}, "auftrag": {"fenster": {"1": {"schritte": ["Zu jed en an der Chilbi und im Skript: Glauben wir sie noch?"}, "aufgabe3": {"text": "{name}: entschieden.", "jetzt": "Aufgabe {m}: {name}.", "knopf": "Zu Aufgabe {m}"}, "irrtum": {"text": "Alle sechs Behauptungen sind geprüft.", "jetzt": "Irrtum vorbehalten: Wie kann ein Entscheid falsch sein?"}, "deuten": {"text": "Alle Geschichten liegen im richtigen Feld.", "jetzt": "Sechs Sätze: Was sagt ein Test, und was nicht?"}, "e3fertig": {"text": "Alle Sätze sind richtig beurteilt.", "jetzt": "Lesen Sie «Eine mögliche Sicht». Unter «Mitnehmen» sichern Sie danach Ihren Stand als Bild."}}, "aufgabe_von": "Aufgabe {n} von {m}", "ziehen": "Ziehen Sie ein Bild oder eine Gleichung aus dem Vorrat auf einen Platz.", "farbe": "#9867A5", "meldung_marken": "In einigen Aufgaben passen Ihre Markierungen nicht mehr zum Text. Sie sind deshalb weg, Ihre Einträge bleiben.", "neuer_text": ["AB1", "AB2", "K1", "K2", "S1", "P2"], "nach_etappe1": ["AB1", "AB2", "S1", "N2", "P1"], "meldung_e1": "Quizbude, Tombola, Würfelbude, Überbuchen und Linkshänder stehen jetzt in Etappe 1. Ihre Einträge dazu in Etappe 2 sind deshalb weg, alles andere bleibt.", "fuehrung": {"kopf": "Geführtes Beispiel", "schritte": {"marken": "Markieren", "angaben": "Angaben", "bild": "Bild", "c": "c wählen", "gleichung": "Gleichung", "ergebnis": "Ergebnis"}, "zeigen": "Zeigen", "gezeigt": "gezeigt"}, "ergebnisfeld": {"titel": "Das Ergebnis (freiwillig)", "satz": "Wenn Sie möchten, rechnen Sie das Ergebnis aus und tragen es ein. Geprüft wird nur, was im Feld steht.", "pruefen": "Ergebnis prüfen", "rechnung": "Rechenschritte zeigen", "rechnungZu": "Rechenschritte verbergen", "rechnungTitel": "Die Rechenschritte", "leer": "Das Feld ist leer — es ist freiwillig."}}};</script>
